<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple To-DO</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <h1 class="text-green-900 text-2xl font-bold flex justify-center">
      Simple To-Do app
    </h1>
    <div class="flex justify-center mt-4">
      <input
        id="task-input-field"
        type="text"
        placeholder="Enter your task here!.."
        class="border rounded-xl p-4"
      />
      <button
        class="add-btn border rounded-xl ml-4 p-4 bg-green-900 text-white font-bold"
        onclick="
          {
            clickAdd();
          }
        "
      >
        Add +
      </button>
    </div>
    <div class="task-container flex justify-center flex-col items-center"></div>
  </body>
  <script src="script.js"></script>
</html>
